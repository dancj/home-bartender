name: Test

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify generated taxonomy is current
        run: |
          npm run codegen
          git diff --exit-code src/taxonomy.generated.ts scripts/taxonomy.generated.mjs TEMPLATE.md \
            || { echo "::error::generated taxonomy artifacts are out of sync with data/taxonomy.yaml. Run 'npm run codegen' locally and commit the regenerated files."; exit 1; }
