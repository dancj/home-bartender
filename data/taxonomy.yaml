# Canonical taxonomy for recipe frontmatter.
#
# Edit this file, then run `npm run codegen` to regenerate:
#   - src/taxonomy.generated.ts (Zod schema source)
#   - scripts/taxonomy.generated.mjs (validator source)
#   - the marker-bounded "Canonical Taxonomy" region of TEMPLATE.md
#
# CI fails if any generated artifact is out of sync with this file.
#
# Entry shape: { slug, label, [source], [note], [aliases] }
# - slug: kebab-case identifier used in frontmatter
# - label: human-readable display string
# - source: optional citation (e.g., "Cocktail Codex")
# - note: optional one-line description
# - aliases: optional alternate names; documentation only in v1
#
# Adding a value is an intentional decision: edit here, run codegen, commit
# the YAML and all regenerated artifacts together.

categories:
  - { slug: classic, label: Classic }
  - { slug: original, label: Original }
  - { slug: seasonal, label: Seasonal }
  - { slug: inbox, label: Inbox }

methods:
  - { slug: shaken, label: Shaken }
  - { slug: stirred, label: Stirred }
  - { slug: built, label: Built }
  - { slug: blended, label: Blended }

